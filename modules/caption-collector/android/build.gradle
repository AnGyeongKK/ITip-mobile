plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.captioncollector'
version = '0.1.0'

android {
  namespace "expo.modules.captioncollector"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
}
